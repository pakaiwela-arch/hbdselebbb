<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* MENJADIKAN HALAMAN BISA DIGESER HALAMAN PER HALAMAN */
    html, body {
      height: 100%;
      overflow-y: mandatory;
      scroll-snap-type: y mandatory; /* Fitur Utama Scroll Snap */
      scroll-behavior: smooth;
      background: linear-gradient(135deg, #c8e6c9, #a5d6a7); /* WARNA BARU: hijau pastel */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
    }

    .container {
      width: 100%;
      height: 100%;
    }

    /* DESAIN SETIAP KARTU AGAR SATU HALAMAN PENUH */
    .card {
      height: 100vh; /* Setinggi layar HP/Monitor */
      width: 100%;
      scroll-snap-align: center; /* Kunci tepat di tengah saat digeser */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* KOTAK KACA UNTUK KONTEN */
    .card-content {
      background: rgba(248, 187, 208, 0.75); /* WARNA BARU: merah muda pastel */
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    h1 {
      font-size: 1.8rem;
    }

    p {
      font-size: 1rem;
      line-height: 1.5;
    }

    /* DESAIN FOTO KARTU 1 DAN KARTU 2 */
    .card-img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* DESAIN VIDEO KARTU 3 */
    .responsive-video {
      width: 100%;
      max-height: 300px;
      border-radius: 15px;
      object-fit: cover;
    }

    /* BALON MELAYANG */
    .balloon-container {
      font-size: 2rem;
      display: flex;
      gap: 15px;
    }

    .balloon {
      display: inline-block;
      animation: bounce 1.8s infinite ease-in-out alternate;
    }

    .balloon:nth-child(2) { animation-delay: 0.3s; }
    .balloon:nth-child(3) { animation-delay: 0.6s; }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- HALAMAN 1 (KARTU 1 + FOTO) -->
    <section class="card">
      <div class="card-content">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <!-- Ganti foto1.jpg dengan nama file foto kamu -->
        <img src="FOTO1.jpeg" alt="photo1" class="card-img">
        <p>Met ultah @alizalsabela, Semoga harimu selalu always dan semua yu hep drim is tercapai!</p>
      </div>
    </section>

    <!-- HALAMAN 2 (KARTU 2 + FOTO) -->
    <section class="card">
      <div class="card-content">
        <!-- Ganti foto2.jpg dengan nama file foto kamu -->
        <img src="FOTO2.jpeg" alt="FOTO2" class="card-img">
        <p>Sekali kali gunakan AI dengan baik dan benar, bersama AI jayakan indonesia, SELAMAT ULANG TAHUN INDONESIA YG KE-81</p>
        <div class="balloon-container">
          <span class="balloon">🎈</span>
          <span class="balloon">🎈</span>
          <span class="balloon">🎈</span>
        </div>
      </div>
    </section>

    <!-- HALAMAN 3 (KARTU 3 + VIDEO) -->
    <section class="card">
      <div class="card-content">
        <p>🎁 Gift For You 🎁</p>
        <video controls autoplay muted loop class="responsive-video">
          <source src="curut.mp4" type="video/mp4">
          Browser kamu tidak mendukung video.
        </video>
      </div>
    </section>

  </div>

</body>
</html>
